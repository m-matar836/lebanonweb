<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل التعديلات - لوحة التحكم</title>
    <script>
        // V58: تحويل تلقائي إلى النسخة أحادية الصفحة (SPA).
        // الروابط القديمة من نوع history.html#c-123 تُحوَّل إلى تمرير لبطاقة التقرير في السجل.
        (function () {
            var hash = window.location.hash || '';
            if (hash.indexOf('#c-') === 0) {
                try { sessionStorage.setItem('spaScrollReportId', hash.substring(3)); } catch (e) {}
                window.location.replace('./index.html#/history');
            } else {
                window.location.replace('./index.html#/history' + (window.location.search || ''));
            }
        })();
    </script>
</head>
<body>
</body>
</html>
